<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lecture 3 Linux terminal</title>
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div id="term_wrap">
    <div id="term_container" aria-label="Linux terminal" tabindex="0"></div>
    <textarea id="term_paste" hidden aria-hidden="true" tabindex="-1"></textarea>
    <div class="runtime-tools">
      <div class="paste-control">
        <label for="paste-input">Paste commands</label>
        <textarea id="paste-input" rows="3" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Paste or type commands here…" aria-describedby="paste-caption paste-status"></textarea>
        <p id="paste-caption">Review before sending. Line breaks may run commands; no extra Enter is added.</p>
        <div class="paste-actions">
          <button id="paste-send" type="button" disabled>Send to terminal</button>
          <button id="paste-clear" type="button" disabled>Clear</button>
          <span class="paste-shortcut"><kbd>⌘Enter</kbd> / <kbd>Ctrl+Enter</kbd> to send</span>
        </div>
        <p id="paste-status" role="status" aria-live="polite"></p>
      </div>
      <div class="upload-tools">
        <label class="upload-control">
          <span>[ upload files ]</span>
          <input type="file" id="files" multiple aria-label="Upload files to the Linux guest" onchange="on_update_files(this.files)">
        </label>
        <progress id="net_progress" aria-label="Loading guest data"></progress>
      </div>
    </div>
    <p id="copyright">JSLinux / TinyEMU · &copy; 2017–2019 Fabrice Bellard</p>
  </div>
  <script src="term.js"></script>
  <script src="jslinux.js"></script>
  <script src="runtime-controller.js"></script>
</body>
</html>
